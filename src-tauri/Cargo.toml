[package]
name = "mneme"
version = "0.1.0"
description = "Personal desktop learning app — Tauri 2 shell wrapping Claude Code CLI"
authors = ["r1ckyIn"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
nix = { version = "0.31", features = ["signal", "process"] }
home = "0.5"
